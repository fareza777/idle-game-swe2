<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Duskspire — Idle Realm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">

  <!-- ============ SPLASH ============ -->
  <div id="splash" class="screen visible">
    <div class="splash-bg"></div>
    <div class="splash-inner">
      <div class="splash-logo"><img src="assets/art/logo.webp" alt="Duskspire" onerror="this.outerHTML='<div class=logo-text>DUSKSPIRE</div>'"></div>
      <div class="splash-sub">IDLE REALM</div>
      <div class="splash-bar"><div id="splash-fill"></div></div>
      <div class="splash-tip" id="splash-tip">Sharpening blades…</div>
    </div>
  </div>

  <!-- ============ TITLE MENU ============ -->
  <div id="menu" class="screen">
    <div class="menu-bg"></div>
    <div class="menu-inner">
      <img class="menu-logo" src="assets/art/logo.webp" alt="Duskspire" onerror="this.outerHTML='<div class=logo-text-big>DUSKSPIRE</div>'">
      <div class="menu-sub">An idle realm of 21 skills, 21 zones and a sleeping god.</div>
      <div class="menu-btns">
        <button id="btn-continue" class="btn btn-primary hidden">▶ Continue</button>
        <button id="btn-new" class="btn btn-primary">✦ New Game</button>
        <button id="btn-settings" class="btn">⚙ Settings</button>
        <button id="btn-about" class="btn">ℹ About</button>
      </div>
      <div class="menu-foot">
        <button id="btn-share" class="chip">Share</button>
        <button id="btn-rate" class="chip">Rate ★</button>
      </div>
    </div>
  </div>

  <!-- ============ ONBOARDING ============ -->
  <div id="onboard" class="screen">
    <div class="ob-card">
      <div id="ob-body"></div>
      <div class="ob-dots" id="ob-dots"></div>
      <button id="ob-next" class="btn btn-primary">Next</button>
      <button id="ob-skip" class="btn-link">Skip</button>
    </div>
  </div>

  <!-- ============ CLASS SELECT ============ -->
  <div id="classpick" class="screen">
    <div class="cp-head"><h1>Choose your Path</h1><p>Five beginnings. No heroes to collect — only you.</p></div>
    <div id="cp-list" class="cp-list"></div>
    <div class="cp-foot"><input id="cp-name" maxlength="16" placeholder="Name your hero (optional)">
      <button id="cp-start" class="btn btn-primary" disabled>Begin the Ascent</button></div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game" class="screen">
    <header id="hud">
      <div class="hud-left">
        <span id="hud-class" class="hud-class">⚔️</span>
        <div><div id="hud-name">Hero</div><div id="hud-lvl" class="hud-lvl">Lv 1</div></div>
      </div>
      <div class="hud-right">
        <div class="hud-coins">🪙 <b id="hud-gold">0</b></div>
        <div id="hud-doing" class="hud-doing">Idle</div>
      </div>
    </header>

    <main id="view"></main>

    <nav id="tabs">
      <button class="tab" data-tab="train"><span>⛏</span>Train</button>
      <button class="tab" data-tab="craft"><span>⚒</span>Craft</button>
      <button class="tab" data-tab="fight"><span>⚔</span>Fight</button>
      <button class="tab" data-tab="bag"><span>🎒</span>Bag</button>
      <button class="tab" data-tab="hero"><span>🧝</span>Hero</button>
      <button class="tab" data-tab="quests"><span>📜</span>Quests</button>
      <button class="tab" data-tab="more"><span>⋯</span>More</button>
    </nav>
  </div>

  <!-- ============ SHARED MODAL / TOAST ============ -->
  <div id="modal" class="modal"><div id="modal-card" class="modal-card"></div></div>
  <div id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/avatar.js"></script>
<script src="js/monavatar.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
